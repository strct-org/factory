name: Build Factory Image

on:
  workflow_dispatch:
    inputs:
      agent_version:
        description: 'Agent Version to install'
        required: true
        default: 'v1.0.3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Factory Scripts
        uses: actions/checkout@v4

      - name: Download Agent from Release
        uses: robinraju/release-downloader@v1
        with:
          repository: "strct-org/strct"
          tag: ${{ inputs.agent_version }}
          fileName: "strct-agent-arm64"

      - name: Download FRPC (Latest Stable)
        run: |
          # 0.54.0+ supports the TOML config your Go code generates
          FRP_VERSION="0.54.0"
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_arm64.tar.gz
          tar -zxvf frp_${FRP_VERSION}_linux_arm64.tar.gz
          mv frp_${FRP_VERSION}_linux_arm64/frpc frpc
          chmod +x frpc

      - name: Move Files to Source Folder
        run: |
          mkdir -p ${{ github.workspace }}/src
          mv strct-agent-arm64 ${{ github.workspace }}/src/
          mv frpc ${{ github.workspace }}/src/
          echo "--- VERIFYING SRC FOLDER ---"
          ls -lh ${{ github.workspace }}/src/
          # Confirm the agent is actually an ARM64 binary
          file ${{ github.workspace }}/src/strct-agent-arm64
          echo "----------------------------"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted udev e2fsprogs util-linux xz-utils

      - name: Download Orange Pi OS Image
        run: |
          # Verified working URL for Orange Pi Zero 3, Debian Bookworm server
          # Source: https://github.com/stas2z/orange-pi-images/releases/tag/0.2-bookworm
          # 1.5gb variant has more free space for apt installs during chroot
          IMG_URL="https://github.com/stas2z/orange-pi-images/releases/download/0.2-bookworm/Orangepizero3_1.0.2_debian_bookworm_server_linux6.1.31_1.5gb.img.xz"
          
          echo "Downloading Orange Pi Zero 3 image..."
          wget --progress=dot:giga -O orangepi.img.xz "$IMG_URL"
          
          # Verify we got a real file, not a 404 HTML page
          FILE_SIZE=$(stat -c%s orangepi.img.xz)
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "[ERROR] Downloaded file is only ${FILE_SIZE} bytes — download likely failed"
            echo "        File contents:"
            head -c 200 orangepi.img.xz
            exit 1
          fi
          echo "Download size: $(ls -lh orangepi.img.xz | awk '{print $5}')"
          
          echo "Decompressing image..."
          unxz orangepi.img.xz
          
          # Rename whatever .img came out to the expected name
          # (avoid glob ambiguity — be explicit)
          IMGFILE=$(ls *.img | head -1)
          [ "$IMGFILE" != "orangepi.img" ] && mv "$IMGFILE" orangepi.img
          echo "Image size: $(ls -lh orangepi.img | awk '{print $5}')"

      - name: Run Build Script
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOMAIN: ${{ secrets.DOMAIN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          cd scripts
          chmod +x *.sh
          sudo -E ./0_build_all.sh

      - name: Verify Built Image
        run: |
          # Runs diagnose.sh against the finished image and prints the result
          # to the Actions log. If PARTUUIDs are wrong or the agent binary
          # is missing, you'll see it here without having to flash the card.
          chmod +x scripts/diagnose.sh
          sudo ./scripts/diagnose.sh --image strct-release-v1.img

      - name: Rename and Compress
        run: |
          sudo chown $(id -u):$(id -g) strct-release-v1.img
          mv strct-release-v1.img strct-os-${{ inputs.agent_version }}.img
          xz -z -v -0 strct-os-${{ inputs.agent_version }}.img

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: strct-os-${{ inputs.agent_version }}
          path: strct-os-${{ inputs.agent_version }}.img.xz
          retention-days: 5