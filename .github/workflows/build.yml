name: Build Orange Pi 3B Image

on:
  workflow_dispatch:
    inputs:
      agent_version:
        description: Agent Version to install
        required: true
        default: v1.0.11

env:
  FRP_VERSION: 0.54.0
  IMAGE_URL: https://github.com/Joshua-Riek/ubuntu-rockchip/releases/latest/download/ubuntu-24.04-preinstalled-server-arm64-orangepi-3b.img.xz

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Factory Scripts
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Restore cached base image
        id: cache-base-image
        uses: actions/cache@v4
        with:
          path: |
            orangepi.img
            orangepi.img.xz
          key: opi3b-base-image-${{ runner.os }}-${{ env.IMAGE_URL }}

      - name: Download Agent from Release
        uses: robinraju/release-downloader@v1
        with:
          repository: strct-org/strct
          tag: ${{ inputs.agent_version }}
          fileName: strct-agent-arm64

      - name: Download FRPC (Latest Stable)
        run: |
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_arm64.tar.gz
          tar -zxf frp_${FRP_VERSION}_linux_arm64.tar.gz
          mv frp_${FRP_VERSION}_linux_arm64/frpc frpc
          chmod +x frpc

      - name: Move Files to Source Folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          mv strct-agent-arm64 "$GITHUB_WORKSPACE/src/"
          mv frpc "$GITHUB_WORKSPACE/src/"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y eatmydata parted udev xz-utils gdisk qemu-user-static binfmt-support wget curl

      - name: Download Base Image (Joshua Riek Ubuntu Server)
        if: steps.cache-base-image.outputs.cache-hit != 'true'
        run: |
          echo "Downloading: $IMAGE_URL"
          wget -q -O orangepi.img.xz "$IMAGE_URL"

          echo "Decompressing..."
          unxz -T0 orangepi.img.xz

          find . -maxdepth 1 -name '*.img' -not -name 'orangepi.img' -exec mv {} orangepi.img \;

      - name: Rehydrate cached image
        if: steps.cache-base-image.outputs.cache-hit == 'true'
        run: |
          if [ -f orangepi.img.xz ] && [ ! -f orangepi.img ]; then
            unxz -T0 orangepi.img.xz
          fi

      - name: Run Build Script
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOMAIN: ${{ secrets.DOMAIN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          cd scripts
          chmod +x ./*.sh
          sudo -E ./0_build_all.sh

      - name: Rename and Compress
        run: |
          sudo chown "$(id -u)":"$(id -g)" strct-release-v1.img
          mv strct-release-v1.img strct-opi3b-${{ inputs.agent_version }}.img
          xz -T0 -3 -v strct-opi3b-${{ inputs.agent_version }}.img

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: strct-opi3b-${{ inputs.agent_version }}
          path: strct-opi3b-${{ inputs.agent_version }}.img.xz
          retention-days: 5
