name: Build Factory Image

on:
  workflow_dispatch:
    inputs:
      agent_version:
        description: 'Agent Version to install'
        required: true
        default: 'v1.0.3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Factory Scripts
        uses: actions/checkout@v4

      - name: Download Agent from Release
        uses: robinraju/release-downloader@v1
        with:
          repository: "strct-org/strct" 
          tag: ${{ inputs.agent_version }}
          fileName: "strct-agent-arm64"
          
      - name: Download FRPC (Latest Stable)
        run: |
          # WE USE 0.54.0 HERE. 
          # Versions >= 0.52.0 support the TOML config your Go code generates.
          FRP_VERSION="0.54.0"
          
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_arm64.tar.gz
          
          tar -zxvf frp_${FRP_VERSION}_linux_arm64.tar.gz
          
          # Move binary from the extracted folder to current dir
          mv frp_${FRP_VERSION}_linux_arm64/frpc frpc
          chmod +x frpc

      - name: Move Files to Source Folder
        run: |
          # Ensure src folder exists at the root of the repo workspace
          mkdir -p ${{ github.workspace }}/src
          
          # Move binaries into it
          mv strct-agent-arm64 ${{ github.workspace }}/src/
          mv frpc ${{ github.workspace }}/src/
          
          echo "--- VERIFYING SRC FOLDER ---"
          ls -lh ${{ github.workspace }}/src/
          echo "----------------------------"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted udev

      - name: Download Base Raspberry Pi Image
        run: |
          wget -q -O rpios.img.xz https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2023-12-11/2023-12-11-raspios-bookworm-arm64-lite.img.xz
          unxz rpios.img.xz
          # The scripts expect the image to be named 'raspberrypi.img' in the ROOT folder
          mv *.img raspberrypi.img

      - name: Run Build Script
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOMAIN: ${{ secrets.DOMAIN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          # Enter the scripts folder
          cd scripts
          
          chmod +x *.sh
          
          # Execute. The script looks for "../src/strct-agent-arm64"
          sudo -E ./0_build_all.sh

      - name: Rename and Compress
        run: |
          # 1. Fix ownership: Change file from root:root to runner:docker
          sudo chown $(id -u):$(id -g) strct-release-v1.img

          # 2. Rename
          mv strct-release-v1.img strct-os-${{ inputs.agent_version }}.img

          # 3. Compress
          xz -z -v -0 strct-os-${{ inputs.agent_version }}.img

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: strct-os-${{ inputs.agent_version }}
          path: strct-os-${{ inputs.agent_version }}.img.xz
          retention-days: 5